<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake or Fact</title>
<!-- PWA : le site s'installe comme une appli (icône sur l'écran d'accueil, plein écran) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#314995">
<link rel="icon" type="image/png" href="ADDS/icons/favicon.png">
<link rel="apple-touch-icon" href="ADDS/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fake or Fact">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
// Anti-cache : les fichiers sont rechargés à chaque ouverture. Plus besoin de changer de numéro dans ce fichier.
var t=Date.now();
var css=document.createElement('link');css.rel='stylesheet';css.href='CSS/style.css?t='+t;document.head.appendChild(css);
</script>
</head>
<body>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
function load(src,next){var s=document.createElement('script');s.src=src+'?t='+t;s.onload=next;document.body.appendChild(s)}
load('cards.js',function(){load('app.js')});
// PWA : on garde l'invitation « Installer » du navigateur (Android / PC) pour le bouton « Install the app » de l'accueil
window.installPrompt=null;
addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.installPrompt=e;if(window.paintInstall)paintInstall()});
addEventListener('appinstalled',function(){window.installPrompt=null;if(window.paintInstall)paintInstall()});
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){})});
</script>
</body>
</html>
